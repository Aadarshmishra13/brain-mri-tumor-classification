
<div id="brain-scene" style="width:100%;height:420px;background:#000;border-radius:16px;overflow:hidden;position:relative;">
  <div id="brain-loading" style="position:absolute;inset:0;display:grid;place-items:center;color:#55D6BE;font:14px sans-serif;">
    Initializing 3D brain...
  </div>
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.160.0";
import { GLTFLoader } from "https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


const root = document.getElementById("brain-scene");
const loading = document.getElementById("brain-loading");
window.addEventListener("error", (event) => {
  loading.textContent = "JavaScript error: " + event.message;
});

window.addEventListener("unhandledrejection", (event) => {
  loading.textContent =
    "Loading error: " + String(event.reason);
});
const scene = new THREE.Scene();
scene.background = new THREE.Color("#000000");

const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(root.clientWidth, root.clientHeight);
renderer.setClearColor("#000000", 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8fffff, 2.2));

const cyanLight = new THREE.PointLight(0x00eaff, 45);
cyanLight.position.set(2, 2, 3);
scene.add(cyanLight);

const tealLight = new THREE.PointLight(0x00a9a9, 25);
tealLight.position.set(-2, -1, 2);
scene.add(tealLight);

const brainGroup = new THREE.Group();
scene.add(brainGroup);

let brain = null;

const loader = new GLTFLoader();
scene.add(new THREE.HemisphereLight(0x9ffcff, 0x071820, 2.0));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(4, 6, 5);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x00e5ff, 18, 30);
rimLight.position.set(-4, 2, -3);
scene.add(rimLight);
  
// Public 3D brain model; the animation runs locally in the browser.
loader.load(
"https://raw.githubusercontent.com/Aadarshmishra13/brain-mri-tumor-classification/main/brain.glb",
  (gltf) => {
    brain = gltf.scene;

  
brain.traverse((obj) => {
  if (obj.isMesh) {
    obj.material = new THREE.MeshStandardMaterial({
      color: 0x55bfc5,
      emissive: 0x00383d,
      emissiveIntensity: 0.15,
      metalness: 0.05,
      roughness: 0.72,
      wireframe: false
    });
  }
});

// Measure the model and center it
brain.updateWorldMatrix(true, true);
const box = new THREE.Box3().setFromObject(brain);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());

// Normalize the model's size
const maxDim = Math.max(size.x, size.y, size.z);
if (maxDim > 0) {
  brain.scale.multiplyScalar(3 / maxDim);
}

// Center the model after scaling
brain.position.set(0, 0, 0);
brain.updateWorldMatrix(true, true);
const centeredBox = new THREE.Box3().setFromObject(brain);
const centered = centeredBox.getCenter(new THREE.Vector3());
brain.position.sub(centered);

brain.rotation.y = Math.PI;
brainGroup.add(brain);

    loading.style.display = "none";
  },
  undefined,
  (error) => {
  loading.textContent =
    "3D model error: " + (error?.message || String(error));
  console.error("Brain model loading failed:", error);
}
);

function resize() {
  const width = root.clientWidth;
  const height = root.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

new ResizeObserver(resize).observe(root);

function animate(time) {
  requestAnimationFrame(animate);

  // Continuous 360° rotation
  brainGroup.rotation.y += 0.01;

  // Gentle floating motion
  brainGroup.position.y = Math.sin(time * 0.0012) * 0.08;

  // Slight natural tilt
  if (brain) {
    brain.rotation.x = Math.sin(time * 0.00035) * 0.08;
  }

  renderer.render(scene, camera);
}

animate(0);
</script>
